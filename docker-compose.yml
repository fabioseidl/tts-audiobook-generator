services:
  xtts:
    build: .
    container_name: xtts-server
    ports:
      - "8000:8000"
    environment:
      # Concurrency comes from processes, not threads. XTTS decodes
      # autoregressively in a Python loop that holds the GIL, so N model
      # instances inside one interpreter take turns and the GPU stays ~13%
      # busy. Each uvicorn worker is its own process with its own GIL and its
      # own model, so they actually overlap.
      # Read by uvicorn as its --workers default.
      WEB_CONCURRENCY: "3"
      # One model per worker; the in-process pool now only guards against a
      # worker being handed two requests at once.
      TTS_POOL_SIZE: "1"
    volumes:
      - ./voices:/app/voices
      - ./output:/app/output
      # XTTS downloads the model into ~/.local/share/tts; persist it so it is
      - ./models:/root/.local/share/tts
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      # First start downloads (~1.8 GB) and loads TTS_POOL_SIZE copies of the
      # model onto the GPU; give it headroom.
      start_period: 600s
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
