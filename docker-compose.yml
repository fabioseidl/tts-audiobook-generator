services:
  xtts:
    build: .
    container_name: xtts-server
    ports:
      - "8000:8000"
    environment:
      # Number of XTTS instances held in memory and served concurrently.
      # ~3 GB of VRAM each after the first; raise only if nvidia-smi shows room.
      TTS_POOL_SIZE: "3"
    volumes:
      - ./voices:/app/voices
      - ./output:/app/output
      # XTTS downloads the model into ~/.local/share/tts; persist it so it is
      # not re-downloaded on every container recreate.
      - ./models:/root/.local/share/tts
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      # First start downloads (~1.8 GB) and loads TTS_POOL_SIZE copies of the
      # model onto the GPU; give it headroom.
      start_period: 600s
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
